name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Assemble app bundle
        run: make app VERSION=0.0.0-ci
      - name: Smoke test the CLI help
        run: build/Jukebox.app/Contents/MacOS/Jukebox --help
