name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, release
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version and signing mode
        id: mode
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -n "$CERT" ] && { [ -n "$APPLE_ID" ] || [ -n "$API_KEY" ]; }; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing; publishing an ad-hoc signed prerelease. See RELEASING.md."
          fi

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/jukebox"
          mkdir -p build/Jukebox.app/Contents/{MacOS,Resources}
          cp "$BIN" build/Jukebox.app/Contents/MacOS/Jukebox
          VERSION="$VERSION" ./scripts/generate-info-plist.sh > build/Jukebox.app/Contents/Info.plist
          lipo -archs build/Jukebox.app/Contents/MacOS/Jukebox

      - name: Import signing certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | awk -F '"' '{print $2}')"
          [ -n "$IDENTITY" ] || { echo "Developer ID Application identity not found"; exit 1; }
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notarization credentials
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "${APPLE_API_KEY_BASE64:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          fi

      - name: Sign
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          set -euo pipefail
          xattr -cr build/Jukebox.app
          if [ "$SIGNED" = "true" ]; then
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" build/Jukebox.app
            codesign --verify --deep --strict --verbose=2 build/Jukebox.app
          else
            codesign --force --sign - build/Jukebox.app
          fi

      - name: Zip (and notarize when signed)
        id: zip
        env:
          VERSION: ${{ steps.mode.outputs.version }}
          SIGNED: ${{ steps.mode.outputs.signed }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd build
          ditto -c -k --keepParent Jukebox.app "Jukebox-${VERSION}.zip"
          if [ "$SIGNED" = "true" ]; then
            ../scripts/notarize.sh "Jukebox-${VERSION}.zip"
            xcrun stapler staple Jukebox.app
            xcrun stapler validate Jukebox.app
            rm -f "Jukebox-${VERSION}.zip"
            ditto -c -k --keepParent Jukebox.app "Jukebox-${VERSION}.zip"
          fi
          echo "sha256=$(shasum -a 256 "Jukebox-${VERSION}.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${NOTARY_API_KEY_PATH:-}" ] && rm -f "$NOTARY_API_KEY_PATH" || true
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.mode.outputs.version }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          set -euo pipefail
          flags=(--generate-notes)
          [ "$SIGNED" = "true" ] || flags+=(--prerelease --notes "Unsigned (ad-hoc) build; not for the Homebrew cask.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/Jukebox-${VERSION}.zip" --clobber
            # A signed re-run promotes an earlier ad-hoc prerelease of the same tag.
            if [ "$SIGNED" = "true" ]; then gh release edit "$TAG" --prerelease=false --latest; fi
          else
            gh release create "$TAG" "build/Jukebox-${VERSION}.zip" --title "$TAG" "${flags[@]}"
          fi

      - name: Update Homebrew tap
        if: steps.mode.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_KEY" ] || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set; the release is published but the cask was not updated. See RELEASING.md."; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:omniaura/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          cp "$GITHUB_WORKSPACE/Casks/mac-jukebox.rb" Casks/mac-jukebox.rb
          sed -i '' 's/^  version ".*"/  version "'"$VERSION"'"/; s/^  sha256 ".*"/  sha256 "'"$SHA256"'"/' Casks/mac-jukebox.rb
          if git diff --quiet && git ls-files --error-unmatch Casks/mac-jukebox.rb >/dev/null 2>&1; then echo "cask unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mac-jukebox.rb
          git commit -m "chore: mac-jukebox ${VERSION}"
          git push origin HEAD:main
          rm -f "$RUNNER_TEMP/tap_key"
